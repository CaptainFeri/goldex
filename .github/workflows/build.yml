name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: goldex-sms-forwarder

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.5"
          arguments: assembleDebug
          build-root-directory: goldex-sms-forwarder

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: goldex-sms-forwarder/app/build/outputs/apk/debug/app-debug.apk
