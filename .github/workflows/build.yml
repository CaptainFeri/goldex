name: Build APK

on:
  push:
    paths:
      - 'goldex-sms-forwarder/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY} $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE
          git checkout ${GITHUB_SHA}

      - name: Set up JDK 17
        run: |
          sudo update-java-alternatives -s $(update-java-alternatives -l | grep "17" | head -1 | cut -d' ' -f1) || true
          echo "$(dirname $(dirname $(update-java-alternatives -l | grep '17' | head -1 | awk '{print $3}')))/bin" >> $GITHUB_PATH

      - name: Accept licenses and install SDK components
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          cd $GITHUB_WORKSPACE/goldex-sms-forwarder
          gradle assembleDebug

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "latest-build" --yes 2>/dev/null || true
          gh release create "latest-build" \
            "$GITHUB_WORKSPACE/goldex-sms-forwarder/app/build/outputs/apk/debug/app-debug.apk" \
            --title "Latest Build" \
            --notes "APK from commit ${GITHUB_SHA}" \
            --latest
