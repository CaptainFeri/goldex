name: Build APK

on:
  push:
    paths:
      - 'goldex-sms-forwarder/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY} $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE
          git checkout ${GITHUB_SHA}

      - name: Set up JDK 17
        run: |
          sudo update-java-alternatives -s $(update-java-alternatives -l | grep "17" | head -1 | cut -d' ' -f1) || true
          echo "$(dirname $(dirname $(update-java-alternatives -l | grep '17' | head -1 | awk '{print $3}')))/bin" >> $GITHUB_PATH

      - name: Accept licenses and install SDK components
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          cd $GITHUB_WORKSPACE/goldex-sms-forwarder
          gradle assembleDebug

      - name: Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/artifact
          cp $GITHUB_WORKSPACE/goldex-sms-forwarder/app/build/outputs/apk/debug/app-debug.apk /tmp/artifact/
          cd /tmp/artifact && zip -r /tmp/app-debug.zip app-debug.apk
          curl -s -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/app-debug.zip \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=app-debug&expiration_in_days=7"
