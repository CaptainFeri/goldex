volumes:
  postgres_data_dev:
    name: goldex_postgres_data_dev_volume
  static_volume:
    name: goldex_static_dev_volume
  pgadmin_data:
    name: goldex_pgadmin_dev_volume
  redis_insight_data:
    name: goldex_redis_insight_dev_volume
  minio_data:
    name: goldex_minio_dev_volume
  rabbitmq_data:
    name: goldex_rabbitmq_dev_volume
  elasticsearch_data:
    name: goldex_elastic_dev_volume
  logs_volume:
    name: logs_dev_volume
  redis_data:
    name: redis_data

networks:
  goldex-network-dev:
    external: true
