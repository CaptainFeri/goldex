services:
  goldex-service-dev:
    container_name: goldex-service-dev
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BASE_APP_POSTGRES_URL=postgres-dev
      - BASE_APP_REDIS_URL=redis-dev
    depends_on:
      - postgres-dev
      - redis-dev
    ports:
      - "${GOLDEX_APP_EXTERNAL_PORT}:${GOLDEX_APP_INTERNAL_PORT}"
    networks:
      - goldex-network-dev
    volumes:
      - static_volume:/app/public
      - logs_volume:/app/logs
    user: root # temporarily elevate

  postgres-dev:
    image: postgres:15-alpine
    container_name: goldex-postgres-db-dev
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${GOLDEX_AUTH_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${GOLDEX_AUTH_POSTGRES_PASSWORD}
      - POSTGRES_DB=${GOLDEX_AUTH_POSTGRES_DBNAME}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${GOLDEX_AUTH_POSTGRES_EXTERNAL_PORT}:${GOLDEX_AUTH_POSTGRES_INTERNAL_PORT}"
    networks:
      - goldex-network-dev

  pgadmin-dev:
    image: dpage/pgadmin4:latest
    container_name: goldex-pgadmin-dev
    restart: always
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${GOLDEX_PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${GOLDEX_PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${GOLDEX_PG_EXTERNAL_PORT}:${GOLDEX_PG_INTERNAL_PORT}"
    networks:
      - goldex-network-dev
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis-dev:
    image: redis:7-alpine
    container_name: goldex-redis-server-dev
    ports:
      - "${GOLDEX_REDIS_EXTERNAL_PORT}:${GOLDEX_REDIS_INTERNAL_PORT}"
    environment:
      - REDIS_HOST=${GOLDEX_REDIS_HOST}
      - REDIS_PORT=${GOLDEX_REDIS_EXTERNAL_PORT}
      - REDIS_TTL=${GOLDEX_REDIS_TTL}
    command: redis-server --appendonly yes
    networks:
      - goldex-network-dev
    volumes:
      - redis_data:/data

  redis-insight-dev:
    image: redis/redisinsight:latest
    container_name: goldex-redis-insight-dev
    restart: always
    ports:
      - "${GOLDEX_REDIS_INSIGHT_EXTERNAL_PORT}:5540"
    environment:
      - RI_REDIS_HOST=${GOLDEX_REDIS_HOST}
      - RI_REDIS_PORT=${GOLDEX_REDIS_INTERNAL_PORT}
      - RI_SERVER_PORT=5540
    volumes:
      - redis_insight_data:/db
    networks:
      - goldex-network-dev
    depends_on:
      - redis-dev

  rabbitmq-dev:
    image: rabbitmq:4-management-alpine
    container_name: goldex-rabbitmq-dev
    restart: always
    ports:
      - "${GOLDEX_RABBITMQ_PORT:-5672}:5672"
      - "${GOLDEX_RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    networks:
      - goldex-network-dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio-dev:
    image: minio/minio:latest
    container_name: goldex-minio-dev
    restart: always
    command: server /data --console-address ":${GOLDEX_MINIO_CONSOLE_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${GOLDEX_MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${GOLDEX_MINIO_ROOT_PASSWORD}
      - MINIO_USE_SSL=false
    ports:
      - "${GOLDEX_MINIO_API_EXTERNAL_PORT}:9000"
      - "${GOLDEX_MINIO_CONSOLE_EXTERNAL_PORT}:${GOLDEX_MINIO_CONSOLE_INTERNAL_PORT}"
    volumes:
      - minio_data:/data
      - ./certs:/root/.minio/certs # Mount SSL certificates
    networks:
      - goldex-network-dev

