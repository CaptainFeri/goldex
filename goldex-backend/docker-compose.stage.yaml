services:
  goldex-service-stage:
    container_name: goldex-service-stage
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BASE_APP_POSTGRES_URL=postgres-stage
      - BASE_APP_REDIS_URL=redis-stage
    depends_on:
      - postgres-stage
      - redis-stage
    ports:
      - "${GOLDEX_APP_EXTERNAL_PORT}:${GOLDEX_APP_INTERNAL_PORT}"
    networks:
      - goldex-network-stage
    volumes:
      - static_volume:/app/static

  postgres-stage:
    image: postgres:15.10
    container_name: goldex-postgres-db-stage
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${GOLDEX_AUTH_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${GOLDEX_AUTH_POSTGRES_PASSWORD}
      - POSTGRES_DB=${GOLDEX_AUTH_POSTGRES_DBNAME}
    volumes:
      - postgres_data_stage:/var/lib/postgresql/data
    ports:
      - "${GOLDEX_POSTGRES_PORT}:5432"
    networks:
      - goldex-network-stage

  pgadmin-stage:
    image: dpage/pgadmin4:8.140
    container_name: goldex-pgadmin-stage
    restart: always
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${GOLDEX_PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${GOLDEX_PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${GOLDEX_PG_PORT}:80"
    networks:
      - goldex-network-stage
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis-stage:
    image: redis:7.4.1-alpine
    container_name: goldex-redis-server-stage
    ports:
      - "${GOLDEX_REDIS_EXTERNAL_PORT}:${GOLDEX_REDIS_INTERNAL_PORT}"
    environment:
      - REDIS_HOST=${GOLDEX_REDIS_HOST}
      - REDIS_PORT=${GOLDEX_REDIS_EXTERNAL_PORT}
      - REDIS_TTL=${GOLDEX_REDIS_TTL}
    command: redis-server --appendonly yes
    networks:
      - goldex-network-stage
    volumes:
      - redis_data:/data

  redis-insight-stage:
    image: redis/redisinsight:latest
    container_name: goldex-redis-insight-stage
    restart: always
    ports:
      - "${GOLDEX_REDIS_INSIGHT_EXTERNAL_PORT}:5540"
    environment:
      - RI_REDIS_HOST=${GOLDEX_REDIS_HOST}
      - RI_REDIS_PORT=${GOLDEX_REDIS_INTERNAL_PORT}
      - RI_SERVER_PORT=5540
    volumes:
      - redis_insight_data:/db
    networks:
      - goldex-network-stage
    depends_on:
      - redis-stage

  rabbitmq-stage:
    image: rabbitmq:4-management-alpine
    container_name: goldex-rabbitmq-stage
    restart: always
    ports:
      - "${GOLDEX_RABBITMQ_PORT:-5672}:5672"
      - "${GOLDEX_RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    networks:
      - goldex-network-stage
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio-stage:
    image: minio/minio:latest
    container_name: goldex-minio-stage
    restart: always
    command: server /data --console-address ":${GOLDEX_MINIO_CONSOLE_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${GOLDEX_MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${GOLDEX_MINIO_ROOT_PASSWORD}
    ports:
      - "${GOLDEX_MINIO_API_EXTERNAL_PORT}:9000"
      - "${GOLDEX_MINIO_CONSOLE_EXTERNAL_PORT}:${GOLDEX_MINIO_CONSOLE_INTERNAL_PORT}"
    volumes:
      - minio_data:/data
    networks:
      - goldex-network-stage

