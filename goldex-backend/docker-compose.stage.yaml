  postgres_data_stage:
    name: goldex_postgres_data_stage_volume
  static_volume:
    name: goldex_static_stage_volume
  pgadmin_data:
    name: goldex_pgadmin_stage_volume
  redis_insight_data:
    name: goldex_redis_insight_stage_volume
  minio_data:
    name: goldex_minio_stage_volume
  rabbitmq_data:
    name: goldex_rabbitmq_stage_volume
  redis_data:
    name: goldex_redis_stage_volume
  elasticsearch_data:
