<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        .email-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-collapse: collapse;
        }

        .header {
            background-color: #0073e6;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .body-content {
            padding: 20px;
            font-size: 16px;
            line-height: 1.5;
            color: #333333;
            text-align: center;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #0073e6;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
        }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>

<body>
    <table class="email-container" align="center" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td class="header">
                <h1>Reset Password</h1>
            </td>
        </tr>
        <tr>
            <td class="body-content">
                <p>We received a <b>request to reset your password.</b> If you made this request, please click the
                    button below
                    to reset your password:</p>
                <a href="{{resetUrl}}" class="button">Reset Password</a>

                <p>If you did not request a password reset, please ignore this email or contact support if you have any
                    questions.</p>
            </td>
        </tr>

    </table>

</body>

</html>
