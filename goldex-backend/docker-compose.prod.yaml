volumes:
  postgres_data_prod:
    name: goldex_postgres_data_prod_volume
  static_volume:
    name: goldex_static_prod_volume
  pgadmin_data:
    name: goldex_pgadmin_prod_volume
  redis_insight_data:
    name: goldex_redis_insight_prod_volume
  minio_data:
    name: goldex_minio_prod_volume
  rabbitmq_data:
    name: goldex_rabbitmq_prod_volume
  redis_data:
