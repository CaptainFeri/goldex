services:
  goldex-service-prod:
    container_name: goldex-service-prod
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BASE_APP_POSTGRES_URL=postgres-prod
      - BASE_APP_REDIS_URL=redis-prod
    depends_on:
      - postgres-prod
      - redis-prod
    ports:
      - "${GOLDEX_APP_EXTERNAL_PORT}:${GOLDEX_APP_INTERNAL_PORT}"
    networks:
      - goldex-network-prod
    volumes:
      - static_volume:/app/static

  postgres-prod:
    image: postgres:15.10
    container_name: goldex-postgres-db-prod
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${GOLDEX_AUTH_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${GOLDEX_AUTH_POSTGRES_PASSWORD}
      - POSTGRES_DB=${GOLDEX_AUTH_POSTGRES_DBNAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "${GOLDEX_AUTH_POSTGRES_EXTERNAL_PORT}:${GOLDEX_AUTH_POSTGRES_INTERNAL_PORT}"
    networks:
      - goldex-network-prod

  pgadmin-prod:
    image: dpage/pgadmin4:8.14
    container_name: goldex-pgadmin-prod
    restart: always
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${GOLDEX_PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${GOLDEX_PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${GOLDEX_PG_EXTERNAL_PORT}:${GOLDEX_PG_INTERNAL_PORT}"
    networks:
      - goldex-network-prod
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis-prod:
    image: redis:7.4.1-alpine
    container_name: goldex-redis-server-prod
    ports:
      - "${GOLDEX_REDIS_EXTERNAL_PORT}:${GOLDEX_REDIS_INTERNAL_PORT}"
    environment:
      - REDIS_HOST=${GOLDEX_REDIS_HOST}
      - REDIS_PORT=${GOLDEX_REDIS_EXTERNAL_PORT}
      - REDIS_TTL=${GOLDEX_REDIS_TTL}
    command: redis-server --appendonly yes
    networks:
      - goldex-network-prod
    volumes:
      - redis_data:/data

  redis-insight-prod:
    image: redis/redisinsight:latest
    container_name: goldex-redis-insight-prod
    restart: always
    ports:
      - "${GOLDEX_REDIS_INSIGHT_EXTERNAL_PORT}:5540"
    environment:
      - RI_REDIS_HOST=${GOLDEX_REDIS_HOST}
      - RI_REDIS_PORT=${GOLDEX_REDIS_INTERNAL_PORT}
      - RI_SERVER_PORT=5540
    volumes:
      - redis_insight_data:/db
    networks:
      - goldex-network-prod
    depends_on:
      - redis-prod

  rabbitmq-prod:
    image: rabbitmq:4-management-alpine
    container_name: goldex-rabbitmq-prod
    restart: always
    ports:
      - "${GOLDEX_RABBITMQ_PORT:-5672}:5672"
      - "${GOLDEX_RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    networks:
      - goldex-network-prod
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio-dev:
    image: minio/minio:latest
    container_name: goldex-minio-prod
    restart: always
    command: server /data --console-address ":${GOLDEX_MINIO_CONSOLE_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${GOLDEX_MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${GOLDEX_MINIO_ROOT_PASSWORD}
    ports:
      - "${GOLDEX_MINIO_API_EXTERNAL_PORT}:9000"
      - "${GOLDEX_MINIO_CONSOLE_EXTERNAL_PORT}:${GOLDEX_MINIO_CONSOLE_INTERNAL_PORT}"
    volumes:
      - minio_data:/data
    networks:
      - goldex-network-prod

