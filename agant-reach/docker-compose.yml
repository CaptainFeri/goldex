services:
  agent-reach:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-reach:latest
    container_name: agent-reach
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=UTC
    volumes:
      - agentreach-config:/home/agentreach/.agent-reach
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/reach/doctor').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  agentreach-config: