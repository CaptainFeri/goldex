<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ChannelSignUtilsV1 – Full Tool</title>
<style>
body{font-family:tahoma;direction:rtl;background:#f4f4f4;padding:20px}
.container{background:#fff;padding:20px;border-radius:8px;max-width:1100px;margin:auto}
select,input,textarea,button{width:100%;margin-top:8px;padding:10px;font-family:monospace}
textarea{min-height:90px;direction:ltr}
button{font-size:16px;cursor:pointer}
label{font-weight:bold;margin-top:10px;display:block}
hr{margin:20px 0}
</style>
</head>
<body>

<div class="container">
<h2>ChannelSignUtilsV1 – Sign & MAC Generator</h2>

<label>انتخاب متد</label>
<select id="methodSelect" onchange="renderInputs()"></select>

<div id="inputs"></div>

<label>Security Key</label>
<textarea id="secretKey" placeholder="security key"></textarea>

<button onclick="generate()">تولید Sign + MAC</button>

<hr>

<label>Sign Text</label>
<textarea id="signText" readonly></textarea>

<label>MAC (HmacSHA256 / HEX)</label>
<textarea id="macText" readonly></textarea>
</div>

<script>
// ==== EXACT Java Logic ====
class SignUtils {
    static createSignText(...values) {
        let s = "";
        values.forEach(v=>{
            if(v!==null && v!==undefined && v!=="") s += "#"+v;
        });
        return s + "#";
    }
}

// ==== METHOD DEFINITIONS (EXACT ORDER) ====
const methods = {
    createLoginText: ["username","password"],
    createChangePasswordText: ["oldPassword","password","passwordConfirm"],
    createEnrollText: ["tenantCode","username","password","loginType"],
    createLogoutText: ["username","tenantCode"],
    createGetBalanceText: ["username","currencyCode","tenant"],
    createRegisterPersonText: [
        "tenant","firstName","lastName","birthDate","fatherName","gender",
        "username","phoneNumber","email","postalCode","address","city",
        "province","country","identifier","nationality","currencyCode",
        "enroll_channelCode","enroll_loginType"
    ],
    createRegisterOrganizationText: [
        "tenant","name","registrationDate","registerCode","username",
        "phoneNumber","email","postalCode","address","city","province",
        "country","identifier","nationality","currencyCode",
        "enroll_channelCode","enroll_loginType"
    ],
    createGetAccountsText: ["username","tenant","currencyCode"],
    createGetPersonText: ["username","tenant"],
    createGetOrganizationText: ["username","tenant"],
    createGetTransactionByVoucherText: ["tenant","username","voucherReference","from","size"],
    createDeleteUserText: ["username","tenant"],
    createConversionRateText: ["fromCurrency","toCurrency"],
    createInquiryRequestText: ["stan","localDate","tenant"],
    createReverseRequestText: ["tenant","amount","stan","localDate"],
    createPosChargeTokenText: ["username","rrn","trace","amount","facilityCode"],
    createChannelPosPayOffText: ["voucherReference","rrn","trace","amount","facilityCode"],
    createVoucherByAccountNumberText: [
        "tenant", "accountNumber", "maximumUsage", "fromEffectiveDate",
        "toEffectiveDate", "trustee", "description", "amounts"
    ],
    createVoucherByCurrencyText: [
        "tenant", "currencyCode", "maximumUsage", "fromEffectiveDate",
        "toEffectiveDate", "trustee", "description", "amounts"
    ],
    payOffVoucherByTransferText: [
        "tenant", "fromUsername", "qrCode", "amount", "description",
        "beneficiaries", "stan", "localDate"
    ]
    // 👆 بقیه متدها دقیقاً به همین شکل اضافه می‌شن
};

// ==== INIT SELECT ====
const select = document.getElementById("methodSelect");
Object.keys(methods).forEach(m=>{
    const o=document.createElement("option");
    o.value=m;o.text=m;
    select.appendChild(o);
});
renderInputs();

// ==== RENDER INPUTS ====
function renderInputs(){
    const box=document.getElementById("inputs");
    box.innerHTML="";
    methods[select.value].forEach(p=>{
        box.innerHTML+=`<label>${p}</label><input id="${p}">`;
    });
}

// ==== GENERATE SIGN + MAC ====
async function generate(){
    const params = methods[select.value].map(p=>document.getElementById(p).value);

    let signText;
    if(params.includes(undefined)) return;

    // handle enroll nested text
    if(select.value.includes("Register")){
        const enroll = SignUtils.createSignText(
            params[params.length-2],
            params[params.length-1]
        );
        params.splice(params.length-2,2,enroll);
    }

    signText = SignUtils.createSignText(...params);
    document.getElementById("signText").value = signText;

    let secretKey = document.getElementById("secretKey").value || "123456";
    const enc = new TextEncoder();

    const key = await crypto.subtle.importKey(
        "raw", enc.encode(secretKey),
        {name:"HMAC",hash:"SHA-256"}, false, ["sign"]
    );

    const sig = await crypto.subtle.sign("HMAC", key, enc.encode(signText));
    const bytes = new Uint8Array(sig);
    let hex="";
    bytes.forEach(b=>hex+=b.toString(16).padStart(2,"0"));

    document.getElementById("macText").value = hex;
}
</script>

</body>
</html>
