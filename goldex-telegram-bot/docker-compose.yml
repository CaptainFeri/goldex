services:
  telegram-bot:
    container_name: goldex-telegram-bot
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:${TELEGRAM_BOT_PORT}
    networks:
      - goldex-bot-network

  postgres:
    container_name: goldex-bot-postgres
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${TELEGRAM_BOT_POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TELEGRAM_BOT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TELEGRAM_BOT_POSTGRES_DBNAME:-goldex-telegram-bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5435:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goldex-bot-network

volumes:
  postgres_data:

networks:
  goldex-bot-network:
    driver: bridge
